name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 本包零依赖，不需要 npm install。构建产物随仓库提交，因此 CI 要
      # 验证「重新构建不产生差异」——防止有人改了 src 却忘了跑 build。
      - name: Build
        run: node scripts/build.mjs

      - name: Build output is committed
        run: git diff --exit-code -- client/client.js

      # 15 项检查：产物语法/工厂契约、4 模块内联、双主题 CSS、
      # 亮暗键集合一致性、样式幂等与回收、apply 容错、组件层插槽与
      # React 缺失降级、组件样式回收、manifest 自洽。
      - name: Verify
        run: node test/run-all.mjs

      - name: Manifest sanity
        run: node -e "const p=require('./package.json'); if(p.name!=='dsh-doubao-ui') throw new Error('bad name'); if(p.dsh.client.platform!=='web') throw new Error('bad platform'); console.log('manifest ok:', p.name, p.version)"
